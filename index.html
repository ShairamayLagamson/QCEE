<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QCEE</title>
  <link rel="stylesheet" href="css/base.css?v=2">
  <link rel="stylesheet" href="css/preview.css?v=2">
  <link rel="stylesheet" href="css/role-picker.css">
  <link rel="stylesheet" href="css/customer-home.css">
</head>
<body data-role="guest">
  <header class="topbar">
    <img src="images/logo.png" alt="Logo" class="logo">
    <h1 class="brand"><span class="q">Q</span><span class="cee">Cee</span></h1>
    <label class="search">
      <input id="searchInput" placeholder="Search...">
      <button type="button" aria-label="Search" data-gate="search"> 🔍︎ </button>
    </label>

    <div class="actions">
      <button class="cart-btn" aria-label="Cart" data-gate="cart">🛒</button>
      <a href="auth_customer.html" data-pick="login" class="btn btn-light">Log In</a>
      <a href="auth_customer.html?mode=register" data-pick="register" class="btn btn-orange">Register</a>
    </div>
  </header>

  <nav class="menu">
    <a href="index.html">Home</a>
    <a href="#" data-gate="default">Menu</a>
    <a href="#about" id="aboutLink">About Us</a>
  </nav>

  <main class="ch-main">

    <!-- banners of the shops: the arrows and dots move between them -->
    <section class="ch-hero" id="hero" aria-label="Featured shops">
      <div class="ch-track" id="track"></div>
      <button type="button" class="ch-arrow prev" id="prev" aria-label="Previous banner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
      <button type="button" class="ch-arrow next" id="next" aria-label="Next banner" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <div class="ch-dots" id="dots"></div>
    </section>

    <section class="ch-block" id="categories">
      <h2 class="ch-h">
        <img src="images/marketplace-ico.png" alt="">
        Marketplace Categories
      </h2>
      <div class="ch-pills" id="pills">
        <button type="button" class="ch-pill on" data-cat="all">All</button>
        <!-- the other categories are filled in by js/preview.js and lead to the pop-up (data-gate="pill") -->
      </div>
      <div class="guest-blur">
      <div class="ch-grid" id="grid"></div>
      <p class="ch-empty" id="empty" hidden></p>
      <div class="guest-cover" aria-hidden="true"></div>
      </div>
    </section>

    <!-- the shops are locked: blurred, and the pop-up opens when they are scrolled to (js/locked-popup.js) or clicked -->
    <div class="locked" id="locked">
      <section class="ch-block" id="shops">
        <h2 class="ch-h">
          <img src="images/shop-ico.png" alt="">
          QCee Shops
        </h2>
        <p class="ch-sub">Explore each featured enterprise shop</p>
        <div class="guest-blur">
        <div class="ch-grid" id="shopGrid"></div>
        <p class="ch-empty" id="shopEmpty" hidden></p>
        <div class="guest-cover" aria-hidden="true"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- "Access Restricted" pop-up: opens once when the visitor scrolls to the locked shops (js/locked-popup.js) -->
  <div class="lock-popup" id="lockPopup" role="dialog" aria-modal="true" aria-labelledby="lpTitle" aria-hidden="true">
    <div class="lock-card">
      <button type="button" class="lp-close" data-lock-close aria-label="Close">&times;</button>
      <img class="lp-logo" src="images/logo2.png" alt="" onerror="this.style.display='none'">
      <h3 id="lpTitle">Access Restricted</h3>
      <p>Please log in or register to access the whole platform.</p>
      <div class="cta-row">
        <a href="auth_customer.html?mode=register" data-pick="register" class="btn btn-dark">Register</a>
        <a href="auth_customer.html" data-pick="login" class="btn btn-light">Log In</a>
      </div>
      <button type="button" class="lp-later" data-lock-close>Maybe later</button>
    </div>
  </div>

  <!-- "login to continue" pop-up for the buttons that are locked (js/preview.js fills in the text) -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="modal">
      <button class="close" data-close aria-label="Close">×</button>
      <div class="emoji" id="mEmoji"></div>
      <h3 id="mTitle"></h3>
      <p id="mText"></p>
      <div class="cta-row">
        <a href="auth_customer.html?mode=register" data-pick="register" class="btn btn-orange">Register</a>
        <a href="auth_customer.html" data-pick="login" class="btn btn-dark">Log In</a>
      </div>
      <button class="later" data-close>Maybe later</button>
    </div>
  </div>

  <div class="ch-toast" id="toast" role="status" aria-live="polite"></div>

  <!-- scripts go LAST, after the page exists -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/footer.js"></script>
  <script src="js/locked-popup.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/role-picker.js"></script>
</body>
</html>k
