<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages · QCee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@200..900&family=Noto+Sans:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/customer-home.css">
  <link rel="stylesheet" href="css/messages.css">
</head>
<body data-role="customer">

  <header class="ch-top">
    <a class="ch-brand" href="customer-home.html">
      <img class="ch-logo" src="images/logo.png" alt="QCee logo" onerror="this.style.display='none'">
      <strong><span class="q">Q</span><span class="cee">Cee</span></strong>
    </a>
    <nav class="ch-nav" aria-label="Main">
      <a href="customer-home.html">Home</a>
      <a href="customer-home.html#shops">Shops</a>
      <a href="customer-home.html#orders">My Orders <i class="ch-live" aria-hidden="true"></i></a>
    </nav>
    <div class="ch-icons">
      <div class="ch-me">
        <button type="button" class="ch-avatar" id="avatar" aria-label="Your account" aria-haspopup="true" aria-expanded="false">Q</button>
        <div class="ch-menu" id="avMenu" hidden>
          <div id="meName">Signed in</div>
          <a class="ch-menu-link" href="customer-profile.html">My Profile</a>
          <button type="button" id="logout">Log out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="ms-main">
    <div class="ms-wrap" id="msWrap">

      <aside class="ms-side">
        <div class="ms-side-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <h1>Messages</h1>
        </div>
        <div class="ms-search">
          <input type="search" id="msSearch" placeholder="Search shops" aria-label="Search messages">
        </div>
        <p class="ms-none" id="msNone" hidden></p>
        <ul class="ms-list" id="msList"></ul>
      </aside>

      <section class="ms-chat">
        <p class="ms-empty" id="msEmpty">Choose a conversation to start.</p>

        <div class="ms-pane" id="msPane" hidden>
          <header class="ms-chat-h">
            <button type="button" class="ms-x" id="msBack" aria-label="Back to messages">&times;</button>
            <span class="ms-av" id="msAv"></span>
            <div class="ms-who">
              <b id="msName"></b>
              <small id="msSub" hidden></small>
            </div>
            <a class="ms-view" id="msView" href="customer-home.html#orders">View Order</a>
          </header>

          <div class="ms-thread" id="msThread"></div>

          <form class="ms-compose" id="msForm" autocomplete="off">
            <button type="button" class="ms-attach" id="msAttach" aria-label="Attach a picture">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
            </button>
            <input type="file" id="msFile" accept="image/*" hidden>
            <input type="text" id="msText" maxlength="1000" placeholder="Enter your message here..." aria-label="Message">
            <button type="submit" class="ms-send" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5z"/></svg>
            </button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <div class="ch-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/footer.js"></script>
</body>
</html>
