<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Messages | QCee Seller</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@200..900&display=swap">
  <link rel="stylesheet" href="css/seller.css">
  <link rel="stylesheet" href="css/messages.css">
</head>
<body data-role="seller">

  <div class="s-head">
  <header class="s-top">
    <img class="s-logo" src="images/logo.png" alt="QCee logo">
    <div class="s-brand">
      <strong><span class="q">Q</span><span class="cee">Cee</span></strong>
    </div>

    <button class="s-chip" id="chipBtn" type="button" aria-label="Your shop and menu"
            aria-haspopup="true" aria-expanded="false" aria-controls="floatMenu">
      <span class="s-avatar" id="shopAvatar">S</span>
      <span class="s-chip-text">
        <b class="js-shopname">My Shop</b>
        <i class="s-dot" id="shopStatus">Active</i>
      </span>
    </button>

    <button class="s-menu-btn" id="menuBtn" type="button"
            aria-label="Open menu" aria-haspopup="true" aria-expanded="false" aria-controls="floatMenu">
      <span></span><span></span><span></span>
    </button>
  </header>

  </div>

  <!-- floating menu -->
  <div class="s-backdrop" id="menuBackdrop" hidden></div>
  <nav class="s-float" id="floatMenu" aria-label="Navigation options" hidden>
    <h2 class="s-float-title">Navigation Options</h2>
    <a href="seller-dashboard.html"><img src="images/home-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>Home</span></a>
    <a href="seller-messages.html" class="active" aria-current="page"><img src="images/messages-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>Message</span></a>
    <a href="order-dashboard.html"><img src="images/order-dashboard-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>Order Dashboard</span></a>
    <a href="stats-dashboard.html"><img src="images/stats-dashboard-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>Stats Dashboard</span></a>
    <a href="my-store.html"><img src="images/my-store-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>My Store</span></a>
    <a href="all-orders.html"><img src="images/all-orders-ico.png" alt="" onerror="this.style.visibility='hidden'"><span>All Orders Queue</span></a>
    <hr>
    <button type="button" id="logout" class="s-logout">Log out</button>
  </nav>

  <main class="ms-main">
    <div class="ms-wrap" id="msWrap">

      <aside class="ms-side">
        <div class="ms-side-h">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>
          <h1>Messages</h1>
        </div>
        <div class="ms-search">
          <input type="search" id="msSearch" placeholder="Search customers" aria-label="Search messages">
        </div>
        <p class="ms-none" id="msNone" hidden></p>
        <ul class="ms-list" id="msList"></ul>
      </aside>

      <section class="ms-chat">
        <p class="ms-empty" id="msEmpty">Choose a conversation to start.</p>

        <div class="ms-pane" id="msPane" hidden>
          <header class="ms-chat-h">
            <button type="button" class="ms-x" id="msBack" aria-label="Back to messages">&times;</button>
            <span class="ms-av" id="msAv"></span>
            <div class="ms-who">
              <b id="msName"></b>
              <small id="msSub" hidden></small>
            </div>
            <a class="ms-view" id="msView" href="seller-orders.html">View Order</a>
          </header>

          <div class="ms-thread" id="msThread"></div>

          <form class="ms-compose" id="msForm" autocomplete="off">
            <button type="button" class="ms-attach" id="msAttach" aria-label="Attach a picture">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg>
            </button>
            <input type="file" id="msFile" accept="image/*" hidden>
            <input type="text" id="msText" maxlength="1000" placeholder="Enter your message here..." aria-label="Message">
            <button type="submit" class="ms-send" aria-label="Send">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.5 21 3l-8.5 18-2.2-7.3L3 11.5z"/></svg>
            </button>
          </form>
        </div>
      </section>

    </div>
  </main>

  <div class="s-toast" id="toast" role="status" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/messages.js"></script>
</body>
</html>
