<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="css/auth-admin.css">
</head>
<body>
  <main class="card">
    <img class="logo" src="images/logo2.png" alt="QCee logo" onerror="this.style.display='none'">
    <h1>Admin Login</h1>
    <p class="hint">Authorized personnel only.</p>
    <form id="adminForm">
      <div class="input-box"><input type="text" id="adminUser" placeholder="Admin username" autocomplete="username" required><i class="bx bxs-user"></i></div>
      <div class="input-box"><input type="password" id="adminPass" placeholder="Password" autocomplete="current-password" required><i class="bx bxs-lock-alt"></i></div>
      <p class="error" id="adminError"></p>
      <button type="submit" class="btn">Login</button>
    </form>
    <a class="back" href="index.html">← Back to QCee</a>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth-admin.js"></script>
</body>
</html>
