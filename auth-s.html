<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login / Register</title>
  <link rel="stylesheet" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css">
  <link rel="stylesheet" href="css/auth-s.css">
</head>
<body>
  <div class="container">

    <!-- LOGIN -->
    <div class="form-box login">
      <img class="form-logo" src="images/logo2.png" alt="QCee logo">
      <form id="loginForm">
        <h1>Login</h1>
        <div class="input-box">
          <input type="text" id="loginId" placeholder="Username" autocomplete="username" required>
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password" required>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <div class="forgot-link"><a href="#">Forgot Password?</a></div>
        <p class="error" id="loginError"></p>
        <button type="submit" class="btn">Login</button>
      </form>
    </div>

    <!-- REGISTER -->
    <div class="form-box register">
      <img class="form-logo" src="images/logo2.png" alt="QCee logo">
      <form id="registerForm">
        <h1>Register</h1>
        <div class="input-box">
          <input type="text" id="regBusiness" placeholder="Business name" autocomplete="organization" required>
          <i class="bx bxs-store"></i>
        </div>
        <div class="input-box">
          <input type="text" id="regSection" placeholder="Section" required>
          <i class="bx bxs-graduation"></i>
        </div>
        <div class="input-box">
          <input type="email" id="regEmail" placeholder="E-mail" autocomplete="email" required>
          <i class="bx bx-envelope"></i>
        </div>
        <div class="input-box">
          <input type="text" id="regUsername" placeholder="Username" autocomplete="username" minlength="3" required>
          <i class="bx bxs-user"></i>
        </div>
        <div class="input-box">
          <input type="password" id="regPassword" placeholder="Password (at least 6 characters)" minlength="6" autocomplete="new-password" required>
          <i class="bx bxs-lock-alt"></i>
        </div>
        <p class="error" id="registerError"></p>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>

    <!-- SLIDING PANEL (one box, two panels) -->
    <div class="toggle-box">
      <div class="toggle-panel toggle-left">
        <h1><span>Welcome</span> <span class="outline">Q<span class="cians">CIANS!</span></span></h1>
        <p>If you don't have an account yet, join us and start your journey.</p>
        <button type="button" class="btn register-btn">Register</button>
      </div>
      <div class="toggle-panel toggle-right">
        <h1><span>Hello</span> <span class="outline">Q<span class="cians">CIANS!</span></span></h1>
        <p>If you already have an account, login here and have fun!</p>
        <button type="button" class="btn login-btn">Login</button>
      </div>
    </div>

  </div>

  <script src="js/auth-s.js"></script>
</body>
</html>
